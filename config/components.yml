# config/components.yml
global:
  python_version: "3.13"
  aws_region: "ap-southeast-7"

components:
  layer:
    type: layer
    path: deployment/terraform/lambda-layer # Directory containing main.tf, variables.tf, etc.
    source_path: deployment/terraform/lambda-layer/shared-layer # Python code to package
    terraform_resource: aws_lambda_layer_version.shared_layer

  image-processor:
    type: lambda
    path: deployment/terraform/image-processor
    source_path: deployment/terraform/image-processor/src
    terraform_resource: aws_lambda_function.image_processor

  ses:
    type: lambda
    path: deployment/terraform/travel-contact
    source_path: deployment/terraform/travel-contact/lambda/src
    terraform_resource: aws_lambda_function.ses_notifier