# config/components.yml
global:
  python_version: "3.13"
  aws_region: "ap-southeast-7"

components:
  layer:
    type: layer
    path: deployment/terraform/lambda-layer/shared-layer

  ses:
    type: lambda
    path: deployment/terraform/travel-contact/lambda/src

  image-processor:
    type: lambda
    path: deployment/terraform/image-processor/src

  cloudfront:
    type: infra
    path: deployment/terraform/cloudfront