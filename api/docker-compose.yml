services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - PORT=8080
    volumes:
      - ./templates:/app/templates  # Hot-reload for templates
      - ./blog:/app/blog            # Hot-reload for blog posts
    command: ["/app/main"]
    