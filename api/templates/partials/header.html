{{ define "header" }}
<nav class="bg-brown-deep shadow-lg" x-data="{ mobileMenuOpen: false }">
    <div class="container-custom">
        <div class="flex items-center justify-between h-16">
            <a href="/" class="flex items-center text-2xl font-bold text-white">
                Villa<span class="text-amber">ChiangMai</span>
            </a>

            <div class="hidden space-x-8 md:flex">
                <a href="/" class="nav-link {{ if eq .ActivePage "home" }}nav-link-active{{ end }}">
                    Home
                </a>
                <a href="/villa" class="nav-link {{ if eq .ActivePage "villa" }}nav-link-active{{ end }}">
                    Villa
                </a>
                <a href="/hostel" class="nav-link {{ if eq .ActivePage "hostel" }}nav-link-active{{ end }}">Hostel</a>
                <a href="/meatshop" class="nav-link {{ if eq .ActivePage "meatshop" }}nav-link-active{{ end }}">Meat Shop</a>
                <a href="/blog" class="nav-link {{ if eq .ActivePage "blog" }}nav-link-active{{ end }}">Blog</a>
                <a href="/contact" class="nav-link {{ if eq .ActivePage "contact" }}nav-link-active{{ end }}">Contact</a>
            </div>

            <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-white md:hidden">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </div>

        <div x-show="mobileMenuOpen" x-cloak class="pb-4 md:hidden">
            <div class="flex flex-col space-y-2">
                <a href="/" class="nav-link hover:text-amber transition-colors {{ if eq .ActivePage "home" }}text-amber font-semibold{{ end }}">Home</a>
                <a href="/villa" class="nav-link {{ if eq .ActivePage "villa" }}text-amber font-semibold{{ end }}">Villa</a>
                <a href="/hostel" class="nav-link {{ if eq .ActivePage "hostel" }}text-amber font-semibold{{ end }}">Hostel</a>
                <a href="/meatshop" class="nav-link {{ if eq .ActivePage "meatshop" }}text-amber font-semibold{{ end }}">Meat Shop</a>
                <a href="/blog" class="nav-link {{ if eq .ActivePage "blog" }}text-amber font-semibold{{ end }}">Blog</a>
                <a href="/contact" class="nav-link {{ if eq .ActivePage "contact" }}text-amber font-semibold{{ end }}">Contact</a>
            </div>
        </div>
    </div>
</nav>
{{ end }}
