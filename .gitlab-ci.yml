image: python:3.13-slim

# Prevent automatic runs on push to master; allow Web UI triggers
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always

stages:
  - lint
  - test
  - package
  - deploy

variables:
  PIPELINE_ACTION:
    value: "deploy"
    options:
      - "deploy"
      - "destroy"
    description: "Action to perform: deploy or destroy component(s)"

  DEPLOY_TARGET:
    value: "all"
    options:
      - "all"
      - "layer"
      - "ses"
      - "image-processor"
      - "cloudfront"
    description: "Select component to target"

  AWS_REGION: "ap-southeast-7"
  ARTIFACTS_DIR: "${CI_PROJECT_DIR}/artifacts"
  SCRIPTS_DIR: "${CI_PROJECT_DIR}/scripts"
  CONFIG_DIR: "${CI_PROJECT_DIR}/config"
  COMPONENTS_CONFIG: "${CONFIG_DIR}/components.yml"
  PYTHON_VERSION: "3.13"

include:
  - local: '.gitlab/pipelines/lint.yml'
  - local: '.gitlab/pipelines/test.yml'
  - local: '.gitlab/pipelines/package.yml'
  - local: '.gitlab/pipelines/deploy.yml'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip/