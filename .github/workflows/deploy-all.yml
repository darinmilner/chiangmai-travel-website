name: 🚀 Deploy Everything

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-lambda:
    name: Deploy Lambda
    uses: ./.github/workflows/deploy-lambda.yml
    with:
      environment: ${{ inputs.environment }}
      run_tests: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SES_SOURCE_EMAIL: ${{ secrets.SES_SOURCE_EMAIL }}
      SES_DESTINATION_EMAIL: ${{ secrets.SES_DESTINATION_EMAIL }}

  deploy-frontend:
    name: Deploy Frontend
    needs: deploy-lambda
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: ${{ inputs.environment }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_ID }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

  deploy-infrastructure:
    name: Deploy Infrastructure
    needs: deploy-lambda
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-7

      - name: Terraform Init
        run: |
          cd infrastructure/terraform
          terraform init

      - name: Terraform Apply
        run: |
          cd infrastructure/terraform
          terraform apply -auto-approve \
            -var="ses_source_email=${{ secrets.SES_SOURCE_EMAIL }}" \
            -var="ses_destination_email=${{ secrets.SES_DESTINATION_EMAIL }}" \
            -var="ses_domain=${{ secrets.SES_DOMAIN }}" \
            -var="environment=${{ inputs.environment }}"

      - name: Get API URL
        id: api-url
        run: |
          cd infrastructure/terraform
          echo "url=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT

      - name: Create Final Summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🎉 Full Deployment Complete!

          ### 📋 Deployment Summary
          | Component | Status | Details |
          |-----------|--------|---------|
          | Lambda | ✅ Deployed | ${{ env.AWS_REGION_BANGKOK }} |
          | Frontend | ✅ Deployed | S3 + CloudFront |
          | SES | ✅ Configured | ${{ env.AWS_REGION_SINGAPORE }} |
          | API Gateway | ✅ Deployed | ${{ steps.api-url.outputs.url }} |

          ### 🌐 Access
          - API: ${{ steps.api-url.outputs.url }}
          - Website: https://${{ secrets.CUSTOM_DOMAIN }}

          ### 📅 Details
          - Environment: ${{ inputs.environment }}
          - Deployed At: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          - Triggered By: ${{ github.actor }}
          EOF