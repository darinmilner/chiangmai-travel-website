name: Deploy Lambdas with Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment Environment"
        type: choice
        options:
          - dev
          - staging
          - production
        default: staging
        required: true
      deploy:
        description: 'Deploy to AWS'
        type: boolean
        default: true
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]
  release:
    types: [ published ]

env:
  AWS_REGION: ap-southeast-7
  TERRAFORM_VERSION: 1.15.8
  PYTHON_VERSION: '3.14'

jobs:
  test-and-package:
    name: Test and Package Lambdas
    runs-on: ubuntu-latest
    outputs:
      lambda_version: ${{ steps.set-version.outputs.lambda_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies for Lambdas
        run: |
          for lambda in lambdas/*/; do
            if [ -f "$lambda/requirements.txt" ]; then
              pip install -r "$lambda/requirements.txt" -t "$lambda"
            fi
          done

      - name: Run Python Lambda tests
        run: |
          pip install pytest pytest-cov
          for lambda in lambdas/*/; do
            if [ -d "$lambda/tests" ]; then
              pytest "$lambda/tests" -v --cov=. --cov-report=term
            fi
          done

      - name: Package Python Lambdas
        run: |
          mkdir -p deployment/packages
          for lambda in lambdas/*/; do
            lambda_name=$(basename "$lambda")
            cd "$lambda"
            rm -rf tests __pycache__ *.pyc .pytest_cache .coverage
            zip -r "../../deployment/packages/${lambda_name}.zip" . -x "*.git*" "*__pycache__*" "*.pyc" "*.pytest_cache*" "*.coverage*"
            cd ../..
          done

      - name: Upload Lambda packages
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: deployment/packages/*.zip
          retention-days: 7

      - name: Set version
        id: set-version
        run: |
          echo "lambda_version=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

  terraform-plan:
    name: Terraform Plan (PR only)
    runs-on: ubuntu-latest
    needs: test-and-package
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lambda packages
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: deployment/packages/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: deployment/terraform/travel-contact
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: deployment/terraform/travel-contact
        run: terraform plan -no-color
        env:
          TF_VAR_lambda_version: ${{ needs.test-and-package.outputs.lambda_version }}
          TF_VAR_environment: staging
        continue-on-error: true

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Generate and post Terraform Plan comment
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          PLAN_ERROR: ${{ steps.plan.outputs.stderr }}
        run: |
          python3 .github/scripts/terraform_comment.py plan /tmp/comment.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.txt

  terraform-deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: test-and-package
    if: |
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lambda packages
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: deployment/packages/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: deployment/terraform/travel-contact
        run: terraform init

      - name: Terraform Plan
        working-directory: deployment/terraform/travel-contact
        run: terraform plan -out=tfplan
        env:
          TF_VAR_lambda_version: ${{ needs.test-and-package.outputs.lambda_version }}
          TF_VAR_environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

      - name: Terraform Apply
        working-directory: deployment/terraform/travel-contact
        run: terraform apply tfplan
        env:
          TF_VAR_lambda_version: ${{ needs.test-and-package.outputs.lambda_version }}
          TF_VAR_environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

      - name: Get Terraform Outputs
        id: terraform_outputs
        working-directory: deployment/terraform/travel-contact
        run: |
          echo "lambda_names=$(terraform output -json lambda_function_names)" >> $GITHUB_OUTPUT
          echo "lambda_arns=$(terraform output -json lambda_function_arns)" >> $GITHUB_OUTPUT

      - name: Install GitHub CLI
        if: github.event_name == 'pull_request'
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Post deployment success comment
        if: success() && github.event_name == 'pull_request'
        env:
          LAMBDA_NAMES: ${{ steps.terraform_outputs.outputs.lambda_names }}
          LAMBDA_ARNS: ${{ steps.terraform_outputs.outputs.lambda_arns }}
          ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
          LAMBDA_VERSION: ${{ needs.test-and-package.outputs.lambda_version }}
        run: |
          python3 .github/scripts/terraform_comment.py deploy /tmp/deploy_comment.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/deploy_comment.txt
