name: 🚀 Deploy Lambda

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_tests:
        description: 'Run tests'
        required: true
        default: true
        type: boolean

env:
  AWS_REGION_BANGKOK: ap-southeast-7
  AWS_REGION_SINGAPORE: ap-southeast-1
  PROJECT_NAME: travel-contact

jobs:
  test:
    name: 🧪 Test Lambda
    runs-on: ubuntu-latest
    if: inputs.run_tests == true
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd deployment/terraform/travel-contact/lambda/src
          pip install -r requirements-test.txt
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          cd deployment/terraform/travel-contact/lambda/src
          pytest tests/ -v --cov=src --cov-report=term

  build:
    name: 📦 Build Lambda
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || inputs.run_tests == false)
    timeout-minutes: 10
    outputs:
      package_hash: ${{ steps.hash.outputs.hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build Lambda Package
        run: |
          cd backend/lambda
          pip install -r requirements.txt
          python3 build.py

      - name: Calculate Package Hash
        id: hash
        run: |
          cd backend/lambda
          echo "hash=$(sha256sum dist/lambda-function.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Upload Lambda Package
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: backend/lambda/dist/lambda-function.zip
          retention-days: 7

  deploy:
    name: 🚀 Deploy Lambda
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lambda Package
        uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: backend/lambda/dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION_BANGKOK }}

      - name: Deploy Lambda Function
        run: |
          FUNCTION_NAME="${{ env.PROJECT_NAME }}-contact-form"
          echo "📦 Updating Lambda: $FUNCTION_NAME"

          # Update function code
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --zip-file fileb://backend/lambda/dist/lambda-function.zip

          # Wait for update to complete
          aws lambda wait function-updated \
            --function-name $FUNCTION_NAME

          # Get function info
          aws lambda get-function \
            --function-name $FUNCTION_NAME \
            --query 'Configuration.[FunctionName,Runtime,LastModified]' \
            --output table

      - name: Update Lambda Environment Variables
        run: |
          FUNCTION_NAME="${{ env.PROJECT_NAME }}-contact-form"

          aws lambda update-function-configuration \
            --function-name $FUNCTION_NAME \
            --environment "Variables={ \
              SES_SOURCE_EMAIL=${{ secrets.SES_SOURCE_EMAIL }}, \
              SES_DESTINATION_EMAIL=${{ secrets.SES_DESTINATION_EMAIL }}, \
              SES_REGION=${{ env.AWS_REGION_SINGAPORE }}, \
              AWS_REGION=${{ env.AWS_REGION_BANGKOK }}, \
              ENVIRONMENT=${{ inputs.environment }} \
            }"

      - name: Create Deployment Summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## ✅ Lambda Deployment Complete

          ### 📋 Details
          | Property | Value |
          |----------|-------|
          | Environment | ${{ inputs.environment }} |
          | Deployed At | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |
          | Triggered By | ${{ github.actor }} |
          | Commit | ${{ github.sha }} |
          | Package Hash | ${{ needs.build.outputs.package_hash }} |

          ### 🌐 Regions
          - Lambda: ${{ env.AWS_REGION_BANGKOK }}
          - SES: ${{ env.AWS_REGION_SINGAPORE }}
          EOF

      - name: Smoke Test
        run: |
          echo "🔍 Running smoke test..."

          # Get API URL from Terraform output or construct it
          API_URL="https://${{ secrets.API_ID }}.execute-api.${{ env.AWS_REGION_BANGKOK }}.amazonaws.com/${{ inputs.environment }}/contact"

          # Test the endpoint
          RESPONSE=$(curl -s -X POST $API_URL \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Smoke Test",
              "email": "smoke-test@example.com",
              "subject": "Smoke Test from GitHub Actions",
              "message": "This is a smoke test to verify the Lambda deployment."
            }')

          echo "Response: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✅ Smoke test passed!"
          else
            echo "❌ Smoke test failed!"
            exit 1
          fi