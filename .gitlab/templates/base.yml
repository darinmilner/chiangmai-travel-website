# .gitlab/templates/base.yml

# Universal base for Linux-level tooling
.base-job:
  before_script:
    - apt-get update && apt-get install -y curl bash jq
    - pip install --upgrade pip
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Python environment extension
.python-base:
  extends: .base-job
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - !reference [.base-job, before_script]
    - pip install pyyaml
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip/