# .gitlab/pipelines/package.yml

package:all:
  stage: package
  extends: .python-base
  before_script:
    - apt-get update && apt-get install -y zip
    - pip install pyyaml
  script:
    - mkdir -p ${ARTIFACTS_DIR}
    - python ${SCRIPTS_DIR}/package.py --config ${COMPONENTS_CONFIG} --artifacts ${ARTIFACTS_DIR}
  artifacts:
    when: on_success
    paths:
      - artifacts/*.zip
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
