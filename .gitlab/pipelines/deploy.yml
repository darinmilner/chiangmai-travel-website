# .gitlab/pipelines/deploy.yml

.deploy_base:
  image: python:3.13-slim
  before_script:
    - apt-get update && apt-get install -y terraform awscli curl
    - pip install pyyaml boto3

deploy:execute:
  stage: deploy
  extends: .deploy_base
  script:
    - bash ${SCRIPTS_DIR}/deploy.sh
  rules:
    # Change 'always' to 'on_success' so it respects previous stage status
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: on_success
