deploy:
  stage: deploy
  image: python:3.13-slim
  id_tokens:
    AWS_JWT_TOKEN:
      aud: https://gitlab.com
  before_script:
    - apt-get update && apt-get install -y wget unzip bash > /dev/null
    - pip install pyyaml > /dev/null
    - |
      if ! command -v terraform &> /dev/null; then
        wget -q https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
        unzip -q terraform_${TERRAFORM_VERSION}_linux_amd64.zip -d /usr/local/bin/
        rm terraform_${TERRAFORM_VERSION}_linux_amd64.zip
      fi
    - source ${SCRIPTS_DIR}/setup_aws_credentials.sh
  script:
    - python ${SCRIPTS_DIR}/deploy.py --command ${PIPELINE_ACTION} --component ${DEPLOY_TARGET} --config ${COMPONENTS_CONFIG} --environment dev