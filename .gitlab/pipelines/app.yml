variables:
  DEPLOY_TARGET:
    value: "none"
    options:
      - "app"
      - "none"
    description: "Select target component to test or deploy"
  ECR_REPOSITORY_NAME: "chiangmaihalal-app-beta-apsoutheast7"

stages:
  - test
  - build

# Step 1: Run Go unit tests across all internal packages
test:golang-api:
  stage: test
  image: golang:1.25-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $DEPLOY_TARGET == "app"'
      when: always
    - when: never
  before_script:
    - apk add --no-libc-dev gcc musl-dev
  script:
    - cd api
    - go mod download
    - go test -v -race -cover ./...

# Step 2: Build Docker image & push to AWS ECR (Runs ONLY if test:golang-api passes)
build:push-to-ecr:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $DEPLOY_TARGET == "app"'
      when: always
    - when: never
  before_script:
    # Install AWS CLI to authenticate with ECR
    - apk add --no-cache aws-cli
    # Log in to AWS ECR
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  script:
    - ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
    - IMAGE_TAG="$ECR_REGISTRY/$ECR_REPOSITORY_NAME"

    # Build image using api/Dockerfile
    - docker build -t $IMAGE_TAG:$CI_COMMIT_SHA -t $IMAGE_TAG:latest -f api/Dockerfile api/

    # Push image to ECR
    - docker push $IMAGE_TAG:$CI_COMMIT_SHA
    - docker push $IMAGE_TAG:latest
