include:
  - local: '.gitlab/templates/base.yml'

test:all:
  stage: test
  extends: .python-base
  before_script:
    - pip install pyyaml pytest pytest-cov pytest-mock
  script:
    - python ${SCRIPTS_DIR}/test.py --config ${COMPONENTS_CONFIG} --artifacts ${ARTIFACTS_DIR}
  artifacts:
    when: always
    paths:
      - artifacts/test-reports/
    reports:
      junit: artifacts/test-reports/junit-*.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - if: '$DEPLOY_TARGET =~ /^(cloudfront|ses)$/'
      when: never
    - when: always