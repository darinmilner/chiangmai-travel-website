# .gitlab/pipelines/lint.yml
include:
  - local: '.gitlab/templates/base.yml'

lint:all:
  stage: lint
  extends: .python-base
  script:
    - python ${SCRIPTS_DIR}/lint.py --config ${COMPONENTS_CONFIG}
  rules:
    # Option 1: Only run on merge requests (default)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

    # Option 2: Only run when manually triggered
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

    # Option 3: Run on master branch (automatic)
    - if: $CI_COMMIT_BRANCH == "master"

    # Option 4: Never run automatically on other branches
    - when: never